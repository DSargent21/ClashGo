syntax = "proto3";

package clashgo.bus;

option go_package = "github.com/Ducky705/ClashGO/internal/bus";

message GameStateEvent {
  int64 timestamp_ms = 1;
  GameState state = 2;
  GameState prev_state = 3;
  int32 confidence = 4;
  int32 confirm_frames = 5;
  int64 capture_ms = 6;
  SystemHealth health = 7;
}

message LootEvent {
  int64 timestamp_ms = 1;
  int32 gold = 2;
  int32 elixir = 3;
  int32 dark_elixir = 4;
  bool meets_req = 5;
  string action = 6;
  string strategy = 7;
}

message ActionEvent {
  int64 timestamp_ms = 1;
  string action = 2;
  string target = 3;
  int32 x = 4;
  int32 y = 5;
  bool success = 6;
  int64 latency_ms = 7;
  string error = 8;
}

message DiagnosticEvent {
  int64 timestamp_ms = 1;
  string type = 2;
  GameState state = 3;
  map<string, string> details = 4;
  bytes frame_jpeg = 5;
}

message EnrichedStateEvent {
  int64 timestamp_ms = 1;
  GameState base_state = 2;
  repeated UIElement ui_elements = 3;
  LootInfo loot = 4;
  repeated TroopCount troops = 5;
}

message UIElement {
  string name = 1;
  int32 x = 2;
  int32 y = 3;
  float confidence = 4;
  string element_type = 5;
}

message LootInfo {
  int32 gold = 1;
  int32 elixir = 2;
  int32 dark_elixir = 3;
  bool valid = 4;
}

message TroopCount {
  string name = 1;
  int32 count = 2;
  int32 slot = 3;
}

message SystemHealth {
  bool adb_connected = 1;
  int64 last_capture_ms = 2;
  double avg_capture_ms = 3;
  int32 consecutive_fails = 4;
}

// ScreenEvent is emitted on every frame capture attempt by the capture loop.
// It is the heartbeat of observability: latency, phash, and diff-vs-previous
// allow the terminal AI to reconstruct what changed at any moment.
message ScreenEvent {
  int64 timestamp_ms = 1;
  int32 width = 2;
  int32 height = 3;
  int64 capture_latency_ms = 4;
  string frame_hash = 5;
  string previous_hash = 6;
  int32 diff_percent = 7;
  bool empty = 8;
  string error = 9;
  string attack_id = 10;
}

// TapEvent is emitted for every tap path (pinpoint, color, template, blind)
// with the tier used, attempt count, coordinates, confidence, and outcome.
message TapEvent {
  int64 timestamp_ms = 1;
  string target_name = 2;
  string tier_used = 3; // "pinpoint" | "color" | "template" | "blind"
  int32 attempt = 4;
  int32 x = 5;
  int32 y = 6;
  int32 ref_x = 7; // 860x732 reference coordinates
  int32 ref_y = 8;
  float confidence = 9;
  int64 total_latency_ms = 10;
  bool success = 11;
  string failure_reason = 12;
  bool yellow_zone = 13;
  string attack_id = 14;
  string slot_name = 15;
}

// SequenceStepEvent tracks each step in the clickSequence (Attack ->
// FindMatch -> ArmyArrow -> Army1 -> Battle).
message SequenceStepEvent {
  int64 timestamp_ms = 1;
  string sequence_id = 2;
  int32 step_index = 3;
  string step_name = 4;
  string outcome = 5; // "ok" | "retry" | "fail"
  int32 retry_count = 6;
  string tier_used = 7;
}

// ClassifierEvent emits the classifier's structured verdict: top score plus
// alternatives, so a terminal AI can spot confidence drift over time.
message ClassifierEvent {
  int64 timestamp_ms = 1;
  GameState state = 2;
  GameState prev_state = 3;
  int32 top_score = 4;
  map<string, int32> alternative_scores = 5;
  int32 confirm_frames = 6;
  int64 capture_ms = 7;
  string attack_id = 8;
}

// DeployEvent captures per-phase / per-unit deployment decisions with the
// surrounding red-zone + slot context, so a trajectory can be reconstructed
// without looking at PNGs.
message DeployEvent {
  int64 timestamp_ms = 1;
  string attack_id = 2;
  string phase = 3;
  string unit = 4;
  int32 slot_x = 5;
  int32 slot_y = 6;
  int32 slot_idx = 7;
  string slot_category = 8; // "Troop" | "Hero" | "Siege" | "Spell" | "CC"
  int32 before_count = 9;
  int32 after_count = 10;
  int32 tap_tier = 11;
  bool red_zone_valid = 12;
  int32 red_zone_x = 13;
  int32 red_zone_y = 14;
  int32 red_zone_w = 15;
  int32 red_zone_h = 16;
  repeated int32 deploy_points = 17; // packed x1,y1,x2,y2,...
}

// AttackSummaryEvent fires once per attack with aggregated outcome.
message AttackSummaryEvent {
  int64 timestamp_ms = 1;
  string attack_id = 2;
  string strategy = 3;
  string target_edge = 4;
  bool deploy_success = 5;
  int32 undeployed = 6;
  int32 stars = 7;
  int32 loot_gold = 8;
  int32 loot_elixir = 9;
  int32 loot_de = 10;
  int32 bonus_gold = 11;
  int32 bonus_elixir = 12;
  int32 bonus_de = 13;
  int64 total_duration_ms = 14;
  int32 tap_count = 15;
  int32 fail_count = 16;
}

enum RestartTrigger {
  RESTART_UNKNOWN = 0;
  RESTART_STUCK_TIMEOUT = 1;
  RESTART_DEPLOY_FAIL = 2;
  RESTART_BATTLE_TIMEOUT = 3;
  RESTART_RETURN_HOME_FAIL = 4;
  RESTART_APP_CRASH = 5;
  RESTART_HEALTH_CHECK = 6;
}

message RestartEvent {
  int64 timestamp_ms = 1;
  RestartTrigger trigger = 2;
  string reason = 3;
  int64 last_action_age_ms = 4;
  string last_state = 5;
}

message StuckEvent {
  int64 timestamp_ms = 1;
  string last_state = 2;
  int64 idle_ms = 3;
  int32 consecutive_fails = 4;
}

message Command {
  int64 timestamp_ms = 1;
  string command_id = 2;
  string type = 3;
  int32 x = 4;
  int32 y = 5;
  int32 x2 = 6;
  int32 y2 = 7;
  int32 duration_ms = 8;
  string target_state = 9;
  string strategy = 10;
  map<string, string> params = 11;
}

message CommandResult {
  int64 timestamp_ms = 1;
  string command_id = 2;
  bool success = 3;
  string error = 4;
  int64 latency_ms = 5;
}

enum GameState {
  UNKNOWN = 0;
  MAIN_VILLAGE = 1;
  BUILDER_BASE = 2;
  BATTLE = 3;
  BATTLE_END = 4;
  ARMY_CAMP = 5;
  SEARCH_MAP = 6;
  FIND_MATCH = 7;
  SETTINGS = 8;
  OBSTACLE_DIALOG = 9;
  GEM_DIALOG = 10;
  CHAT_OPEN = 11;
  SHIELD_INFO = 12;
  RETURN_HOME = 13;
  LOADING = 14;
  WELCOME_BACK = 15;
  ARMY_SELECTION = 16;
}