# Release — auto-publish ClashGO releases from tags.
#
# Pushing a tag like `v0.3.1` triggers this workflow. It builds the
# macOS zip + DMG + latest.json (the exact artifacts `make release`
# produces locally) on a fresh macOS runner and publishes them to a
# GitHub Release with the tag name as the version.
#
# Secrets: this workflow uses ONLY the built-in GITHUB_TOKEN (scoped to
# `contents: write` below). No personal access token is embedded
# anywhere — the released app itself talks to the public GitHub API
# unauthenticated, so nothing secret ships to end users.
#
# To cut a release:
#     git tag v0.3.1 && git push origin v0.3.1
# That's it — the release appears once the build finishes.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish v${{ github.ref_name }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install OpenCV (gocv build dependency)
        run: |
          brew install opencv
          # gocv resolves OpenCV via pkg-config; make sure the freshly
          # installed keg is the one on the path.
          echo "PKG_CONFIG_PATH=$(brew --prefix opencv)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build release artifacts (zip + DMG + latest.json)
        # Strip the leading "v" from the tag for VERSION.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release VERSION="$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="build/bin/ClashGO-v${VERSION}-macOS.zip"
          DMG="build/bin/ClashGO.dmg"
          MANIFEST="build/bin/latest.json"
          for f in "$ZIP" "$DMG" "$MANIFEST"; do
            if [[ ! -f "$f" ]]; then
              echo "missing expected artifact: $f" >&2
              exit 1
            fi
          done

          # Prerelease = tag contains a dash (e.g. v0.3.1-beta).
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$ZIP" \
            "$DMG" \
            "$MANIFEST" \
            --title "ClashGO $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG

          echo "Release published: $GITHUB_REF_NAME"
