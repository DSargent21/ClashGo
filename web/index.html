<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="theme-color" content="#0B0B0C"/>
    <title>ClashGO Mission Control</title>
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121214'/%3E%3Cpath d='M16 5l9 3.4v6.8c0 5.9-3.8 9.9-9 12.4-5.2-2.5-9-6.5-9-12.4V8.4z' fill='none' stroke='%23E3B341' stroke-width='2'/%3E%3Cpath d='M17.5 10l-5 7h3.8l-1.3 7 6-8h-3.8z' fill='%23E3B341'/%3E%3C/svg%3E"
    />
    <script>
        // Theme bootstrap — runs before React so the first paint is correct.
        // Dark is the product default; an explicit light choice in Settings
        // persists as localStorage `darkMode = "false"`.
        (function () {
            try {
                var stored = localStorage.getItem('darkMode');
                var dark = stored === null ? true : stored === 'true';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        html, body { background-color: #0b0b0c; }
        html:not(.dark), html:not(.dark) body { background-color: #f6f6f7; }
    </style>
</head>
<body>
<div id="root"></div>
<!--
    Browser-mode Wails IPC stub. Loaded BEFORE the React module script:
    defer scripts execute in document order, then `<script type="module">`
    runs (HTML spec). `/wails-stub.js` lives in `web/public/` so Vite
    serves it as `/wails-stub.js` from the project root. The stub is
    hostname-gated (localhost / 127.0.0.1 only) so production never
    installs it. See /web/public/wails-stub.js for the install logic.
-->
<script defer src="/wails-stub.js"></script>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
