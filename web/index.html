<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ClashGo Command Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              headline: ["Geist", "sans-serif"],
              body: ["Inter", "sans-serif"],
              label: ["Inter", "sans-serif"],
            },
            fontSize: {
              'headline-md': ['1.5rem', { lineHeight: '2rem', letterSpacing: '-0.025em' }],
              'label-sm': ['0.875rem', { lineHeight: '1.25rem', letterSpacing: '0.05em' }],
              'body-md': ['1rem', { lineHeight: '1.5rem' }],
            },
            spacing: {
              'gutter': '24px',
            },
            colors: {
              primary: "#09090b",
              "on-primary": "#ffffff",
              "ethereal-cyan": "#09090b",
              "ethereal-violet": "#09090b",
              "ethereal-blue": "#09090b",
              "border-subtle": "rgba(0, 0, 0, 0.08)",
              "surface-container-low": "#f4f4f5",
              "surface-container-high": "#e4e4e7",
              "surface-container-lowest": "#fafafa",
              "on-surface-variant": "#71717a",
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
