<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ClashGO Mission Control</title>
    <!--
        Empty data-URI favicon silences the per-page `GET /favicon.ico
        404` console noise we saw during browser-mode dev. We don't have
        a custom icon asset (the bundled app uses the macOS .app icon)
        so an empty stub is the smallest valid answer.
    -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>    <script>
        // Theme bootstrap — must run BEFORE React mounts to avoid a flash of
        // the wrong theme.
        //
        // Default is LIGHT unless the user previously opted into dark via
        // `localStorage.setItem('darkMode', 'true')` (see SettingsView).
        // We deliberately do NOT honor `prefers-color-scheme: dark` because:
        //   1. macOS defaults to dark, which forces the entire UI onto
        //      `bg-zinc-950` (#09090b) — at full Retina resolution that's
        //      effectively an indistinguishable-black surface (text + cards
        //      blend into the frame color), which users perceive as a
        //      "black screen" rather than a Crash.
        //   2. Wails/WkWebView on macOS now also defaults to the system
        //      appearance (`NSAppearanceNameDarkAqua` in `main.go`), so the
        //      webview chrome already matches — forcing `dark` here just
        //      stacks two dark layers and washes out detail.
        // The SettingsView lets the user switch back manually.
        (function() {
            try {
                const darkMode = localStorage.getItem('darkMode');
                if (darkMode === 'true') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        html, body {
            background-color: #fafafa;
        }
        html.dark, html.dark body {
            background-color: #09090b;
        }
    </style>
</head>
<body>
<div id="root"></div>
<!--
    Browser-mode Wails IPC stub. Loaded BEFORE the React module script:
    defer scripts execute in document order, then `<script type="module">`
    runs (HTML spec). `/wails-stub.js` lives in `web/public/` so Vite
    serves it as `/wails-stub.js` from the project root. The stub is
    hostname-gated (localhost / 127.0.0.1 only) so production never
    installs it. See /web/public/wails-stub.js for the install logic.
-->
<script defer src="/wails-stub.js"></script>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
