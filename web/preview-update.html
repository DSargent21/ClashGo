<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UpdateBanner Preview \u2014 ClashGO</title>
  <meta name="viewport" content="width=1200,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg-app: #fafafa;
      --tx-primary: #09090b;
      --tx-secondary: #71717a;
    }
    .dark { --bg-app: #09090b; --tx-primary: #fafafa; --tx-secondary: #52525b; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg-app);
      color: var(--tx-primary);
      font-family: 'Inter', system-ui, sans-serif;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Shadow tokens (synced to the real app). */
    .shadow-premium { box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.06); }
    .shadow-premium-lg { box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 24px 60px rgb(0 0 0 / 0.18); }

    /* Animation tokens (synced). */
    @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.94) translateY(8px) }
      to   { opacity: 1; transform: scale(1) translateY(0) }
    }
    @keyframes shimmer { from { transform: translateX(-100%) } to { transform: translateX(300%) } }

    /* Sparkle gradient ring for the restart splash. */
    .splash-ring-1 { animation: ping 2s cubic-bezier(0,0,0.2,1) infinite; }
    .splash-ring-2 { animation: pulse 1.4s cubic-bezier(0.4,0,0.6,1) infinite; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { headline: ['Inter', 'system-ui', 'sans-serif'] },
          boxShadow: {
            premium:    '0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.06)',
            'premium-lg': '0 1px 2px rgb(0 0 0 / 0.04), 0 24px 60px rgb(0 0 0 / 0.18)',
          },
        },
      },
    };
  </script>
</head>
<body class="dark">

        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 font-bold text-sm">

    <main class="flex-1 ml-64">

            <span class="material-symbols-outlined text-sm">system_update</span>
            Update 0.2.0-beta
            <span class="w-1 h-1 rounded-full bg-emerald-500 animate-pulse" />
          </button>

          <button data-state-switch="downloading"

          <button data-state-switch="ready"

          <button data-state-switch="restarting"

      <section class="px-12 pb-24">
        <div class="grid grid-cols-2 gap-6">

          <div id="stage" class="relative col-span-2 rounded-[3rem] border border-zinc-100/50 dark:border-zinc-800/50 bg-zinc-50/40 dark:bg-zinc-950/40 p-12 min-h-[600px] flex items-center justify-center"></div>

    </main>
  </div>

        <div class="px-7 pb-7 pt-2 flex flex-col gap-3">

            <span class="relative flex items-center gap-2 group-hover:text-zinc-950 transition-colors duration-500">

            <button class="h-10 rounded-xl bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-1.5">

              <div class="text-[10px] font-black text-emerald-500 uppercase tracking-[0.35em] mb-1.5 flex items-center gap-2">

              <span class="material-symbols-outlined text-base">close</span>

        </div>
        <div class="px-7 py-5 space-y-3">
          <div class="flex items-center gap-2.5 px-3 py-2 rounded-xl bg-emerald-500/15 border border-emerald-500/40 shadow-[0_0_24px_-8px_rgba(16,185,129,0.5)]">
            <span class="material-symbols-outlined text-emerald-500 text-base">verified_user</span>
            <span class="text-xs font-bold text-zinc-950 dark:text-white">Verified. Ready to install.</span>
          </div>

          <p class="text-[11px] text-zinc-500 dark:text-zinc-400 leading-relaxed">Click <strong class="text-zinc-950 dark:text-white">Install &amp; Restart</strong> to apply now. The helper script will swap the running bundle and relaunch. ClashGO will exit briefly during the swap.</p>

  <template id="t-error">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-zinc-950/40 backdrop-blur-md">
      <div class="bg-white dark:bg-zinc-900 rounded-[2rem] border border-zinc-100/50 dark:border-zinc-800/50 shadow-premium-lg max-w-md w-full overflow-hidden">
        <div class="px-7 pt-7 pb-5 border-b border-zinc-50 dark:border-zinc-800/50">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="text-[10px] font-black text-emerald-500 uppercase tracking-[0.35em] mb-1.5 flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">rocket_launch</span>ClashGO Update
              </div>
              <h2 class="font-headline text-[1.7rem] font-bold tracking-tight text-zinc-950 dark:text-white leading-tight">Update error</h2>
            </div>
            <button class="w-9 h-9 rounded-xl bg-zinc-50 dark:bg-zinc-800 flex items-center justify-center text-zinc-500 dark:text-zinc-400">
              <span class="material-symbols-outlined text-base">close</span>

        </div>

            <span class="text-xs font-bold text-rose-600 dark:text-rose-400">Update check did not complete.</span>

        <div class="px-7 pb-7 pt-2 flex flex-col gap-3">
          <button class="h-12 w-full rounded-2xl bg-zinc-950 dark:bg-white text-white dark:text-zinc-950 font-black text-[11px] uppercase tracking-[0.3em] flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">refresh</span>Re-check

  <template id="t-restarting">
    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-zinc-950/95 backdrop-blur-2xl">
      <div class="text-center space-y-7 max-w-sm px-6">
        <div class="relative inline-flex items-center justify-center w-24 h-24 mx-auto">
          <div class="absolute inset-0 rounded-full border-2 border-emerald-500/30 splash-ring-1" style="animation: ping 2s cubic-bezier(0,0,0.2,1) infinite"></div>
          <div class="absolute inset-2 rounded-full border-2 border-emerald-500/50 splash-ring-2" style="animation: pulse 1.4s cubic-bezier(0.4,0,0.6,1) infinite"></div>
          <div class="relative w-16 h-16 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-[0_0_40px_-8px_rgba(16,185,129,0.6)]">
            <span class="material-symbols-outlined text-white text-3xl" style="animation: spin 2.5s linear infinite">autorenew</span>
          </div>
        </div>
        <div class="space-y-2.5">
          <h3 class="font-headline text-2xl font-bold tracking-tight text-white">Restarting ClashGO</h3>
          <p class="text-sm text-zinc-400 leading-relaxed">Installing <span class="font-mono font-bold text-emerald-400">v0.2.0-beta</span>. The new build will appear in your dock in a moment.</p>
        </div>
        <div class="text-[10px] font-black text-zinc-600 uppercase tracking-[0.4em]">don\u2019t quit this window</div>
      </div>
    </div>
  </template>

  <script>
    const stage = document.getElementById('stage');
    const order = ['available', 'downloading', 'ready', 'error', 'restarting'];
    function show(state) {
      stage.innerHTML = '';
      const tpl = document.getElementById('t-' + state);
      if (!tpl) return;
      stage.appendChild(tpl.content.cloneNode(true));
    }
    document.querySelectorAll('[data-state-switch]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        show(btn.getAttribute('data-state-switch'));
      });
    });
    // Auto-cycle once for visual verification.
    let idx = 0;
    show(order[idx++]);
    setInterval(() => { show(order[idx % order.length]); idx++; }, 4000);
  </script>
</body>
</html>
