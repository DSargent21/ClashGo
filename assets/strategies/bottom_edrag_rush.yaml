# REQUIRES 'bottom' side in pCfg.Sides.
# The user has only classified {left, right, top} so far; running this
# strategy before re-picking -mode=four with a real bottom line will
# hit SpotsForSide(pCfg, "bottom", ...) which returns nil (side key
# missing). The orchestrator's redZone fallback may rescue it, but
# re-run `./cmd/pick_coords -mode four` and click a real bottom-aligned
# line FIRST for reliable deploy.
name: "EDrag Rush - Bottom"
description: "Professional Balloon + EDrag attack with Double Diamond precision on the BOTTOM side. Rage goes on Line A (outer), Ice on Line B (inner)."
target_edge: "bottom"
auto_deploy_eventTroops: true
phases:
  - name: "Balloons"
    units: [{ name: "Balloon", amount: "All" }]
    pattern: "Line"
    offset: 80 # Near the outer Yellow line
    retry: 3
    verify_before_next: true
    delay_after_ms: 10

  - name: "Electro Dragons"
    units: [{ name: "Electro Dragon", amount: "All" }]
    pattern: "Line"
    offset: 60 # Slightly inside balloons
    retry: 3
    verify_before_next: true
    delay_after_ms: 10

  - name: "Siege Machine"
    units: [{ name: "Stone Slammer", amount: "All" }]
    pattern: "Point"
    position: "Center"
    offset: 50 # Dead middle of the gap
    retry: 3
    delay_after_ms: 10

  - name: "Heroes"
    units:
      - { name: "Barbarian King", amount: "All" }
      - { name: "Barbarian King", amount: "All", pattern: "Ability" }
      - { name: "Archer Queen", amount: "All" }
      - { name: "Archer Queen", amount: "All", pattern: "Ability" }
      - { name: "Grand Warden", amount: "All" }
      - { name: "Grand Warden", amount: "All", pattern: "Ability" }
      - { name: "Minion Prince", amount: "All" }
      - { name: "Minion Prince", amount: "All", pattern: "Ability" }
      - { name: "Dragon Duke", amount: "All" }
      - { name: "Dragon Duke", amount: "All", pattern: "Ability" }
    pattern: "Point"
    position: "Center"
    offset: 40 # Closer to the Blue line
    retry: 3
    delay_after_ms: 10

  - name: "Spells"
    units:
      - { name: "Rage Spell", amount: "All" }
      - { name: "Ice Spell", amount: "All" }
    pattern: "Line"
    offset: 30 # Near the point of entry
    retry: 3
    delay_after_ms: 10
