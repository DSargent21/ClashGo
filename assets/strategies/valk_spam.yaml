name: "Valkyrie Earthquake Spam"
description: "Spam Valkyries on all 4 sides, followed by Heroes/Siege and Earthquakes"
target_edge: "Random"
# The Valkyrie ring plus heroes secures the win well before the stall
# timer would fire; end the battle as soon as destruction hits 50%.
end_at_percent: 50
# The Valkyrie loadout lives in the 4th saved-army recipe ("Imported Army 4"); arm it before
# the battle instead of the default first recipe.
army_slot: 4

# What to put in the saved recipe before starting: the launch screen renders
# this verbatim, and the counts match the phases below (44 Valkyries fill 352
# camp space at 8 each, 11 Earthquakes fill the 11 spell slots).
loadout:
  army_camp: 352
  spell_capacity: 11
  siege_capacity: 1
  troops:
    - { name: "Valkyrie", count: 44, slots: 8 }
  spells:
    - { name: "Earthquake Spell", count: 11, slots: 1 }
  siege:
    - { name: "Stone Slammer", count: 1 }
phases:
  - name: "Valkyrie Spam"
    units: [{ name: "Valkyrie", amount: "All", fallback_slot: 2 }]
    pattern: "FourSides"
    offset: 0
    delay_after_ms: 100

  - name: "Earthquakes"
    units:
      # Only the earthquake spell: the armed recipe (slot 4, "Imported Army 4")
      # carries 44 valkyries, 11 earthquake spells and one siege machine — no
      # event troop — so declaring one made the full-army guard reject the
      # attack on a card that can never read above zero.
      - { name: "Earthquake Spell", amount: "All" }
    pattern: "Point"
    position: "Center"
    delay_after_ms: 100

  - name: "Siege & Heroes"
    units:
      - { name: "Stone Slammer", amount: "All" }
      - { name: "Barbarian King", amount: "All" }
      - { name: "Archer Queen", amount: "All" }
      - { name: "Grand Warden", amount: "All" }
      - { name: "Dragon Duke", amount: "All" }
    pattern: "Point"
    position: "Center"
    offset: 150
    delay_after_ms: 50

  - name: "Abilities"
    units:
      - { name: "Barbarian King", amount: "All", pattern: "Ability" }
      - { name: "Archer Queen", amount: "All", pattern: "Ability" }
      - { name: "Grand Warden", amount: "All", pattern: "Ability" }
    pattern: "Ability"
    delay_after_ms: 0

