name: "Auto EDrag Rush"
description: "Professional Balloon + EDrag attack with Double Diamond precision. Per-unit deploy coordinates come from auto_edrag_rush_formula.json (authored once via cmd/design_attack). target_edge: Random picks a corner per attack; if a per-corner override exists in formula.corner_overrides[<CORNER>] the bot uses it as-authored, otherwise it falls back to mirroring the formula's BottomRight default. This gives an unpredictable per-attack landing side while keeping a single authored formula. See docs/formula-authoring.md for the full workflow."
# target_edge options:
#   "TopLeft" / "TopRight" / "BottomLeft" / "BottomRight" - pin a single side
#   "Random" - pick a random corner per attack (recommended for unattended runs)
#   "Rotate"  - cycle TL -> TR -> BR -> BL across attacks (persistent state)
target_edge: "Random"
stall_timer_seconds: 35
auto_deploy_eventTroops: true

# What to put in the saved recipe before starting (rendered by the launch
# screen). Counts mirror the phase units below: 10 E-Drags then 10 Balloons,
# 5 Rage + 1 Ice (the 11 spell slots), one siege machine.
loadout:
  army_camp: 352
  spell_capacity: 11
  siege_capacity: 1
  troops:
    # 10 x 30 + 10 x 5 = 350 of the 352 army camp (live army screen).
    - { name: "Electro Dragon", count: 10, slots: 30 }
    - { name: "Balloon", count: 10, slots: 5 }
  spells:
    # Rage takes 2 of the 11 spell slots, Ice takes 1: 5 x 2 + 1 x 1 = 11.
    - { name: "Rage Spell", count: 5, slots: 2 }
    - { name: "Ice Spell", count: 1, slots: 1 }
  siege:
    - { name: "Stone Slammer", count: 1 }
phases:
  - name: "Balloons"
    units: [{ name: "Balloon", amount: "All" }]
    pattern: "Line" # Formula drives coords (auto_edrag_rush_formula.json → "balloon")
    offset: 80 # Fallback only — used if formula is missing the unit
    retry: 3
    verify_before_next: true
    delay_after_ms: 10

  - name: "Electro Dragons"
    units: [{ name: "Electro Dragon", amount: "All" }]
    pattern: "Line" # Formula drives coords (auto_edrag_rush_formula.json → "electro dragon")
    offset: 80 # Fallback only — used if formula is missing the unit
    retry: 3
    verify_before_next: true
    delay_after_ms: 10

  - name: "Siege Machine"
    units: [{ name: "Stone Slammer", amount: "All" }]
    pattern: "Point"
    position: "Center"
    offset: 50 # Dead middle of the gap
    retry: 3
    delay_after_ms: 10

  - name: "Spells"
    units:
      # Rage first, then ice: the armed saved recipe (slot 1) carries both (live
      # 2026-11-11: rage template-matched at x=583, ice at x=699). Rage is
      # declared here because leaving it undeclared did not place it later — it
      # left the card for the sweep, which cast it AFTER the heroes (~35s in) and
      # on the troop line instead of Line A. Declaring it puts it on Line A in
      # the Spells phase, which is where the user pinned it. If the armed recipe
      # ever drops rage again, this line must go with it: an empty declared card
      # trips the training.full_army_before_attack guard.
      # Counts are AUTHORED, not "All": the spell badge is unreadable at
      # 1024x768 (a 5 reads 1, an 11 reads 1), so "All" handed the OCR a
      # decision it cannot make and the card was abandoned after one cast. If
      # the armed recipe changes, update these two numbers.
      - { name: "Rage Spell", amount: "5" }
      - { name: "Ice Spell", amount: "1" }
    pattern: "Line" # Formula drives coords (auto_edrag_rush_formula.json → "ice spell")
    offset: 30 # Fallback only — used if formula is missing the unit
    retry: 3
    delay_after_ms: 10

  - name: "Heroes"
    units:
      - { name: "Barbarian King", amount: "All" }
      - { name: "Archer Queen", amount: "All" }
      - { name: "Grand Warden", amount: "All" }
      - { name: "Minion Prince", amount: "All" }
      - { name: "Dragon Duke", amount: "All" }
      - { name: "Royal Champion", amount: "All" }
    pattern: "Point"
    position: "Center"
    offset: 40 # Closer to the Blue line
    retry: 3
    delay_after_ms: 10

  - name: "Abilities"
    units:
      - { name: "Barbarian King", amount: "All", pattern: "Ability" }
      - { name: "Archer Queen", amount: "All", pattern: "Ability" }
      - { name: "Grand Warden", amount: "All", pattern: "Ability" }
      - { name: "Minion Prince", amount: "All", pattern: "Ability" }
      - { name: "Dragon Duke", amount: "All", pattern: "Ability" }
      - { name: "Royal Champion", amount: "All", pattern: "Ability" }
    pattern: "Ability"
    delay_after_ms: 0


